version: '3.8'

services:
  auth_service:
    build:
      context: ./server
    command: >
      sh -c "cd services/auth_service &&
             python manage.py migrate &&
             gunicorn auth_service.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CORS_ALLOWED_ORIGINS=${FRONTEND_URL:-http://localhost:5173}

  article_service:
    build:
      context: ./server
    command: >
      sh -c "cd services/article_service &&
             gunicorn article_service.wsgi:application --bind 0.0.0.0:8001"
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CORS_ALLOWED_ORIGINS=${FRONTEND_URL:-http://localhost:5173}

  image_service:
    build:
      context: ./server
    command: >
      sh -c "cd services/image_service &&
             gunicorn image_service.wsgi:application --bind 0.0.0.0:8002"
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CORS_ALLOWED_ORIGINS=${FRONTEND_URL:-http://localhost:5173}

  frontend:
    build:
      context: ./client
      args:
        - VITE_AUTH_SERVICE_URL=${VITE_AUTH_SERVICE_URL:-http://localhost:8000/api/auth}
        - VITE_ARTICLE_SERVICE_URL=${VITE_ARTICLE_SERVICE_URL:-http://localhost:8001/api/articles}
        - VITE_IMAGE_SERVICE_URL=${VITE_IMAGE_SERVICE_URL:-http://localhost:8002/api/images}
    ports:
      - "5173:80"
